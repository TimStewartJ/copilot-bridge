name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - "staging/**"
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The shallow checkout brings no tags, and changelog-check compares each package with its
      # latest release tag. The tagged trees are all it reads, so one commit per tag is enough.
      - name: Fetch release tags
        shell: pwsh
        run: git fetch --depth=1 --no-recurse-submodules origin "+refs/tags/*:refs/tags/*"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Cross-platform test audit
        shell: pwsh
        run: npm run test:xplat-audit

      - name: Public repo audit
        shell: pwsh
        run: npm run test:public-audit

      - name: Package changelog check
        shell: pwsh
        run: npm run packages:changelog-check

      - name: Agent text audit
        shell: pwsh
        run: npm run test:agent-text-audit

      - name: Comment audit
        shell: pwsh
        run: npm run test:comment-audit

      - name: Design system audit
        shell: pwsh
        run: npm run test:design-audit

      - name: Client typecheck
        shell: pwsh
        run: npm run typecheck:client

      - name: Package typecheck
        shell: pwsh
        run: npm run typecheck:packages

      - name: Build
        shell: pwsh
        run: npm run build

      - name: Run tests with coverage
        shell: pwsh
        run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        shell: pwsh
        run: node .\scripts\write-coverage-summary.mjs coverage\coverage-summary.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
          if-no-files-found: ignore
